name: Snyk CI/CD Demo

on:
  push:
    branches: ["dev", "feature/**"] # Runs on pushes to dev and any feature/* branch
  pull_request:
    branches: ["main"] # Runs when a PR is opened/updated targeting main
  workflow_dispatch: # Manual run: pick the branch in "Use workflow from"

jobs:
  security:
    runs-on: ubuntu-latest # Fresh GitHub-hosted Ubuntu VM (Node and Docker preinstalled)

    env: # Variables available to every step in this job
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }} # Snyk auth token, read from repo secrets
      SNYK_ORG: 8be633af-0a0d-458a-bf97-c6bf11439fe5 # Snyk org ID that receives the results
      BRANCH: ${{ github.head_ref || github.ref_name }} # PR source branch, or the pushed/selected branch
      REPO_URL: github.com/mawisnyk/Demo # Repo URL Snyk shows for these snapshots

    steps:
      # Step 1: Pull this repo's code onto the runner
      - uses: actions/checkout@v5

      # Step 2: Install Node.js (needed to resolve dependencies and to install the Snyk CLI)
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Step 3: Install the Snyk CLI globally so `snyk` works in later steps
      - name: Install Snyk CLI
        run: npm install -g snyk

      # Snyk Code (SAST): run before npm install so node_modules isn't scanned
      # continue-on-error: true keeps the pipeline green even if issues are found (snyk exits 1 on findings)
      - name: Snyk Code
        continue-on-error: true
        run: snyk code test --org=$SNYK_ORG --severity-threshold=high

      # Snyk Code snapshot: sends results to the Snyk UI as a separate project per branch
      # Requires --report enabled for the org. snyk exits 1 when findings exist, so continue-on-error keeps the job going.
      - name: Snyk Code snapshot (branch ${{ env.BRANCH }})
        continue-on-error: true
        run: |
          echo "Reporting Snyk Code results for branch: $BRANCH"
          snyk code test --org=$SNYK_ORG --report \
            --project-name=code-analysis \
            --remote-repo-url=$REPO_URL \
            --target-reference=$BRANCH

      # Step 4: Install the project's own dependencies (package.json) so Snyk can resolve them
      - name: Install dependencies
        run: npm install

      # Snyk Open Source (SCA) test
      # continue-on-error: true means this step never fails the pipeline, even if issues are found
      - name: Snyk Open Source
        continue-on-error: true
        run: snyk test --org=$SNYK_ORG --severity-threshold=high

      # Snyk Open Source monitor: snapshot to the Snyk UI for ongoing monitoring
      - name: Snyk Open Source monitor
        continue-on-error: true
        run: |
          snyk monitor --org=$SNYK_ORG \
            --remote-repo-url=$REPO_URL \
            --target-reference=$BRANCH
